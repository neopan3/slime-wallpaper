<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4c7">
  <title>MAX到達記念スマホ壁紙｜スライムぶんぶん研究所</title>
  <meta name="description" content="プレイしてくれた方へ、MAX到達記念のスマホ壁紙をプレゼントします。">
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="wallpaper-page max-page">
  <main class="wallpaper-card" aria-labelledby="page-title">
    <p class="eyebrow">MAX RESULT WALLPAPER</p>
    <h1 id="page-title">プレイしてくれてありがとう！</h1>
    <p class="lead">画像長押しで保存してね</p>

    <figure class="wallpaper-frame">
      <span class="max-badge" aria-hidden="true">MAX</span>
      <img
        class="wallpaper-image"
        src="../assets/wallpapers/max.png"
        alt="MAX到達記念スマホ壁紙">
    </figure>

    <p class="save-guide">
      スマホでは画像を長押しして保存してください。
    </p>
    <a
      class="download-button"
      href="../assets/wallpapers/max.png"
      download="slime-wallpaper-max.png">
      画像を保存する
    </a>
  </main>
</body>
</html>
